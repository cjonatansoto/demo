<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo de Jobs - Procesamiento de Documentos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        body {
            background: #000000;
            color: #ffffff;
        }
        .glass-effect {
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-primary {
            background: #EC0000;
            color: white;
        }
        .btn-primary:hover {
            background: #C40000;
        }
        .btn-danger {
            background: #EC0000;
            color: white;
        }
        .btn-danger:hover {
            background: #C40000;
        }
    </style>
</head>
<body class="min-h-screen bg-black">
    <!-- Navbar -->
    <nav class="glass-effect border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <i class="bi bi-file-earmark-pdf text-2xl text-red-400"></i>
                    <h1 class="text-xl font-semibold text-white">Procesamiento de Documentos</h1>
                </div>
                <button onclick="openModal()" class="btn-primary px-6 py-2.5 rounded-lg font-medium flex items-center space-x-2">
                    <i class="bi bi-play-circle"></i>
                    <span>Iniciar Job</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Alertas -->
        <div th:if="${message}" class="mb-6 glass-effect rounded-xl p-4 border border-green-500/30 bg-green-500/10">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="bi bi-check-circle text-green-400 text-xl"></i>
                    <span class="text-green-300" th:text="${message}"></span>
                </div>
                <button onclick="this.parentElement.parentElement.remove()" class="text-green-400 hover:text-green-300">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>
        <div th:if="${error}" class="mb-6 glass-effect rounded-xl p-4 border border-red-500/30 bg-red-500/10">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="bi bi-exclamation-circle text-red-400 text-xl"></i>
                    <span class="text-red-300" th:text="${error}"></span>
                </div>
                <button onclick="this.parentElement.parentElement.remove()" class="text-red-400 hover:text-red-300">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>

        <!-- Jobs Table -->
        <div class="glass-effect rounded-2xl overflow-hidden">
            <div class="p-6 border-b border-white/10">
                <h2 class="text-2xl font-bold text-white">Estado de Jobs</h2>
            </div>
            <div class="p-6">
                <div th:if="${jobs == null || jobs.isEmpty()}" class="text-center py-12">
                    <i class="bi bi-inbox text-6xl text-gray-600 mb-4"></i>
                    <p class="text-gray-400 text-lg">No hay jobs ejecutados aún</p>
                </div>

                <div th:if="${jobs != null && !jobs.isEmpty()}" class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-white/10">
                                <th class="text-left py-4 px-4 text-sm font-semibold text-gray-400">ID</th>
                                <th class="text-left py-4 px-4 text-sm font-semibold text-gray-400">Token</th>
                                <th class="text-left py-4 px-4 text-sm font-semibold text-gray-400">Estado</th>
                                <th class="text-left py-4 px-4 text-sm font-semibold text-gray-400">Inicio</th>
                                <th class="text-left py-4 px-4 text-sm font-semibold text-gray-400">Items</th>
                                <th class="text-left py-4 px-4 text-sm font-semibold text-gray-400">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="job : ${jobs}" class="border-b border-white/5 hover:bg-white/5 transition-colors">
                                <td class="py-4 px-4 text-white font-mono text-sm" th:text="${job.executionId}"></td>
                                <td class="py-4 px-4">
                                    <code class="text-xs text-red-300 bg-red-500/20 px-2 py-1 rounded" th:text="${job.token}"></code>
                                </td>
                                <td class="py-4 px-4">
                                    <span th:switch="${job.status}" class="px-3 py-1 rounded-full text-xs font-medium">
                                        <span th:case="'COMPLETED'" class="bg-green-500/20 text-green-400">COMPLETED</span>
                                        <span th:case="'FAILED'" class="bg-red-500/20 text-red-400">FAILED</span>
                                        <span th:case="'STARTING'" class="bg-blue-500/20 text-blue-400">STARTING</span>
                                        <span th:case="'STARTED'" class="bg-yellow-500/20 text-yellow-400">STARTED</span>
                                        <span th:case="*" class="bg-gray-500/20 text-gray-400" th:text="${job.status}"></span>
                                    </span>
                                </td>
                                <td class="py-4 px-4 text-gray-300 text-sm" th:text="${job.startTime != null ? #temporals.format(job.startTime, 'yyyy-MM-dd HH:mm') : 'N/A'}"></td>
                                <td class="py-4 px-4 text-gray-300 text-sm">
                                    <span th:text="${job.itemsRead}"></span> / <span th:text="${job.itemsWritten}"></span>
                                </td>
                                <td class="py-4 px-4">
                                    <div class="flex space-x-2">
                                        <a th:href="@{/job/{id}(id=${job.executionId})}" 
                                           class="px-4 py-2 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded-lg text-sm font-medium flex items-center space-x-1">
                                            <i class="bi bi-eye"></i>
                                            <span>Ver</span>
                                        </a>
                                        <form th:action="@{/job/delete/{id}(id=${job.executionId})}" method="post" class="inline" 
                                              th:onsubmit="return confirm('¿Está seguro de eliminar este job y sus documentos relacionados?');">
                                            <button type="submit" 
                                                    class="btn-danger px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-1">
                                                <i class="bi bi-trash"></i>
                                                <span>Eliminar</span>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="jobModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="glass-effect rounded-2xl max-w-md w-full p-6 border border-white/20">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-white">Iniciar Nuevo Job</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white">
                    <i class="bi bi-x-lg text-2xl"></i>
                </button>
            </div>
            <form th:action="@{/job/start}" method="post">
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Token JWT</label>
                    <input type="text" name="token" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                           placeholder="Token JWT (mockeado por ahora)" required>
                    <p class="mt-2 text-xs text-gray-500">El endpoint está mockeado, cualquier token será aceptado.</p>
                </div>
                <div class="flex space-x-3">
                    <button type="button" onclick="closeModal()" 
                            class="flex-1 px-4 py-3 bg-white/5 hover:bg-white/10 text-white rounded-lg font-medium transition-all">
                        Cancelar
                    </button>
                    <button type="submit" 
                            class="flex-1 btn-primary px-4 py-3 rounded-lg font-medium">
                        Iniciar Job
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('jobModal').classList.remove('hidden');
            document.getElementById('jobModal').classList.add('flex');
        }
        function closeModal() {
            document.getElementById('jobModal').classList.add('hidden');
            document.getElementById('jobModal').classList.remove('flex');
        }
    </script>
</body>
</html>
